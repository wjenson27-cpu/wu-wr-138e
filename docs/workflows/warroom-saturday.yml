name: War Room Saturday green-dots check

# Saturday 10:23 AM PT. GitHub cron is UTC: 17:23 UTC = 10:23 AM PDT. After the first Sunday in November
# (PST, UTC-8) this fires at 9:23 AM PT until March; use "23 18 * * 6" then if the exact time matters.
# Install: Bill moves this file to .github/workflows/ (the bot token has no `workflow` scope) and merges.
# Scheduled workflows only run from the default branch.
#
# Review-only: this job pushes NOTHING and opens no PR. It uploads the refreshed green-dots files as an
# artifact; Eddie/Bill review and commit them by hand.
on:
  schedule:
    - cron: "23 17 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warroom-saturday
  cancel-in-progress: false

jobs:
  green-dots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # ci mode = green dots (reads Woellert's public Substack API) + JSON validation + tests. No Fantrax.
      - run: python3 scripts/refresh_warroom.py --mode ci
      - name: Detect changes (tracked AND new files)
        id: diff
        run: |
          CH="$(git status --porcelain -- data)"
          echo "$CH"
          if [ -n "$CH" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Upload for review (no push, no PR)
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: green-dots-review
          path: |
            data/green-dots.json
            data/green-dots-status.json
          retention-days: 14
