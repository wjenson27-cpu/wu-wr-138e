name: War Room Saturday green-dots check

# Saturday 10:23 AM PT. GitHub cron is UTC: 17:23 UTC = 10:23 AM PDT. After the first Sunday in November
# (PST, UTC-8) this fires at 9:23 AM PT until March; change to "23 18 * * 6" then if the exact time matters.
# Scheduled workflows only run from the default branch, so this does nothing until Bill merges the branch.
on:
  schedule:
    - cron: "23 17 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warroom-saturday
  cancel-in-progress: false

jobs:
  green-dots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # ci mode = green dots + JSON validation + tests only. No Fantrax / box-browser inputs.
      - run: python3 scripts/refresh_warroom.py --mode ci
      # Never pushes to main. Changes go to a review branch; Bill decides whether to merge.
      - name: Push changes to a review branch (not main)
        run: |
          if git diff --quiet -- data; then echo "no data changes"; exit 0; fi
          BR="auto/green-dots-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data/green-dots.json data/green-dots-status.json
          git commit -m "auto: Saturday green-dots refresh (review before merging)"
          git push origin "$BR"
