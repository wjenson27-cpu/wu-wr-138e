<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#002244">
<title>Eddies ROS Trade Finder</title>
<link rel="icon" href="img/eddies.png">
<link rel="stylesheet" href="css/warroom.css">
<style>
main{padding:10px 12px;max-width:720px;margin:0 auto}
.idea{border-left-width:4px}
.idea h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fit{font-size:.72rem;font-weight:800;color:#041208;background:#69BE28;border-radius:99px;padding:2px 8px;white-space:nowrap}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.side{background:#061018;border-radius:8px;padding:8px}
.side .k{font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#A5ACAF}
.side .who{font-weight:800;margin-top:2px}
.side .sub{font-size:.68rem;color:#A5ACAF;margin-top:2px}
.stat b.delta{color:#69BE28;font-size:1.15rem}
.stat b.delta.flat{color:#fcd34d}
.why{margin-top:6px}
.pos{margin-left:4px}
table.sheet td.num,table.sheet th.num{text-align:right}
tr.mine td{color:#86efac}
</style>
</head>
<body>
<div class="sticky-top">
<header><div class="hdr"><img src="img/eddies.png" alt="Eddies"><div><h1>ROS Trade Finder</h1>
<div class="sub">Eagle Ridge Eddies · ideas only · <a href="index.html" style="color:#69BE28">Back to War Room</a></div></div></div></header>
<div class="strip" id="strip">Loading…</div>
</div>
<main id="root"></main>
<p class="footer">Recommend-only. This page does not send trades or contact Fantrax.</p>
<script>
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function club(name){return name==='Towner Top Aga Bottom'?'TTAB':name}
function signed(n){var x=Number(n)||0;return (x>0?'+':'')+x.toFixed(1)}
function side(list){
  return list.map(function(p){
    return '<div class="who">'+e(p.name)+' <span class="pos '+e(p.pos)+'">'+e(p.pos)+'</span></div>'+
      '<div class="sub">'+e(p.nfl||'')+(p.ros!=null?' · '+Number(p.ros).toFixed(1)+' ROS':'')+'</div>';
  }).join('');
}
fetch('data/trade-finder.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  document.getElementById('strip').innerHTML='Week <span>'+e(d.week)+'</span> · roster <span>'+e(d.asOfRoster)+'</span> · FAAB <span>$'+e(d.faab)+'</span> · <span>'+d.ideas.length+' ideas</span>';
  var h='<div class="banner">Recommend-only. Bill decides what to do with these. Nothing on this page is sent anywhere.</div>';
  h+='<div class="card"><h2>What the Eddies are shopping</h2>';
  h+='<p>'+e(d.eddied.needs)+'</p>';
  h+='<p>LB surplus: <b>'+e(d.eddied.surplus.LB.join(', '))+'</b>. Bench WRs: <b>'+e(d.eddied.surplus.WR.join(', '))+'</b>.</p>';
  h+='<p>Keeps, never outgoing: <b>'+e(d.keeps.join(', '))+'</b>. Season-ending and left out: <b>'+e(d.excludedSeasonEnding.join(', '))+'</b>.</p></div>';
  h+='<div class="sec">Ranked ideas</div>';
  d.ideas.forEach(function(idea){
    var tone=idea.valueDelta>0?'':' flat';
    h+='<div class="card idea"><h3><span>'+idea.rank+'. '+e(club(idea.partner))+'</span><span class="fit">fit '+idea.fitScore+'</span></h3>';
    h+='<p class="tiny">'+e(idea.record)+(idea.faab!=null?' · FAAB $'+e(idea.faab):'')+' · '+e(idea.shape)+'</p>';
    h+='<div class="swap"><div class="side"><div class="k">Eddies give</div>'+side(idea.give)+'</div>';
    h+='<div class="side"><div class="k">Eddies get</div>'+side(idea.get)+'</div></div>';
    h+='<div class="statgrid"><div class="stat"><b class="delta'+tone+'">'+signed(idea.valueDelta)+'</b><span>Eddies value</span></div>';
    h+='<div class="stat"><b class="delta'+(idea.partnerDelta>=1?'':' flat')+'">'+signed(idea.partnerDelta)+'</b><span>Their lineup</span></div></div>';
    h+='<p class="why">'+e(idea.whyItWorksForThem)+'</p></div>';
  });
  if(d.notes&&d.notes.length){
    h+='<div class="card"><h3>Notes</h3>';
    d.notes.forEach(function(n){h+='<p>'+e(n)+'</p>'});
    h+='</div>';
  }
  h+='<div class="sec">Usable pieces around the league</div>';
  h+='<p class="tiny">Usable means above the ROS bar in the method note (about 9 points a game at RB, 12 at LB/DL/DB). TTAB is Towner Top Aga Bottom.</p>';
  h+='<div class="scroll"><table class="sheet"><thead><tr><th>Club</th><th class="num">RB</th><th class="num">WR</th><th class="num">DL</th><th class="num">LB</th><th class="num">DB</th></tr></thead><tbody>';
  (d.leagueDepth||[]).forEach(function(t){
    var u=t.usable||{};
    h+='<tr'+(t.teamId==='eddies'?' class="mine"':'')+'><td>'+e(club(t.team))+'</td><td class="num">'+u.RB+'</td><td class="num">'+u.WR+'</td><td class="num">'+u.DL+'</td><td class="num">'+u.LB+'</td><td class="num">'+u.DB+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var m=d.method||{};
  h+='<div class="card"><h3>How the value is built</h3>';
  h+='<p>'+e(m.valueDelta)+'</p><p>'+e(m.offense)+'</p><p>'+e(m.idp)+'</p><p>'+e(m.injury)+'</p><p>'+e(m.fit)+'</p>';
  h+='<p class="tiny">Roster file '+e(d.sources&&d.sources.rosters)+' · scraped '+e(d.asOfRoster)+' · built '+e(d.generatedAt)+'.</p></div>';
  document.getElementById('root').innerHTML=h;
}).catch(function(){document.getElementById('strip').textContent='Could not load data/trade-finder.json'});
</script>
</body>
</html>
