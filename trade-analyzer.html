<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#002244">
<title>Eddies Trade Analyzer</title>
<link rel="icon" href="img/eddies.png">
<link rel="stylesheet" href="css/warroom.css">
<style>
main{padding:10px 12px 24px;max-width:980px;margin:0 auto}
.ta-lede{font-size:.8rem;color:#A5ACAF;margin:0 0 10px;line-height:1.4}
.ta-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ta-picks label{display:flex;flex-direction:column;gap:4px;font-size:.65rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#A5ACAF;min-width:0}
.ta-picks select{text-transform:none;letter-spacing:0;font-weight:700;margin:0}
.ta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.ta-result h2,.ta-roster h3,.ta-side h3{margin:0 0 6px}
.ta-side h3,.ta-roster h3{display:flex;align-items:center;gap:8px;font-size:.95rem}
.ta-side h4{margin:10px 0 4px;font-size:.65rem;letter-spacing:.04em;text-transform:uppercase;color:#A5ACAF}
.ta-summary{font-size:.9rem;font-weight:700;color:#e8eaed;line-height:1.35}
.ta-season,.ta-note,.ta-starters,.ta-empty{margin:4px 0;color:#A5ACAF;font-size:.75rem;line-height:1.35}
.ta-meter{display:flex;height:8px;margin:0 0 10px;border-radius:99px;overflow:hidden;background:#061018}
.ta-meter span{display:block;height:100%}
.ta-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.78rem}
.ta-table th,.ta-table td{text-align:left;padding:3px 4px;border-bottom:1px solid #122334}
.ta-table th{color:#69BE28;font-size:.62rem;text-transform:uppercase}
.ta-table tr.is-changed td:last-child{color:#69BE28;font-weight:800}
.ta-holes{margin:4px 0 0;padding-left:1.1rem}
.ta-holes li{margin:2px 0}
.ta-points{list-style:none;margin:0;padding:0}
.ta-points li{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;margin:3px 0;font-size:.82rem}
.ta-pos{color:#A5ACAF;font-size:.62rem;font-weight:800;letter-spacing:.04em}
.ta-roster{max-height:28rem;overflow:auto}
.ta-player{display:flex;gap:8px;align-items:flex-start;margin:3px 0;font-size:.84rem}
.ta-player input{width:auto;margin:2px 0 0;flex-shrink:0}
.ta-player span{min-width:0;overflow-wrap:anywhere}
.ta-side,.ta-roster,.ta-result{min-width:0}
.ta-mark{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.pos-label{font-size:.65rem;font-weight:800;color:#A5ACAF;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px}
#taResult{scroll-margin-top:108px}
@media (max-width:800px){
  .ta-picks,.ta-grid{grid-template-columns:1fr}
  .ta-roster{max-height:none}
}
</style>
</head>
<body>
<div class="sticky-top">
<header>
  <div class="hdr">
    <img src="img/eddies.png" alt="Eddies">
    <div>
      <h1>Trade Analyzer</h1>
      <div class="sub">Eagleridge Eddie's · desk copy · <a href="index.html" style="color:#69BE28">Back to War Room</a></div>
    </div>
  </div>
</header>
<div class="strip" id="strip">Loading roster and ranking files…</div>
</div>
<main id="main-content">
  <p class="ta-lede" id="taLede">Desk copy for Eagleridge Eddie's. Loading roster and ranking files.</p>
  <div id="taApp" aria-busy="true">
    <div class="card"><p>Loading roster and ranking files.</p></div>
  </div>
</main>
<p class="footer">Eagleridge Eddie's · desk copy · read only, nothing is sent</p>
<script src="js/trade-analyzer.js"></script>
</body>
</html>
