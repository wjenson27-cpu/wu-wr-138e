<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#002244">
<title>Eddies IDP Rankings</title>
<link rel="icon" href="img/eddies.png">
<link rel="stylesheet" href="css/warroom.css">
<style>
main{padding:10px 12px;max-width:720px;margin:0 auto}
.ic{background:#0b1c2e;border-radius:10px;border-left:4px solid #1e3a5f;padding:10px 12px;margin-bottom:7px}
.ic.t1{border-left-color:#69BE28}.ic.t2{border-left-color:#7eb6ff}.ic.t3{border-left-color:#38bdf8}.ic.t4{border-left-color:#a78bfa}.ic.t5{border-left-color:#f59e0b}.ic.t6,.ic.t7,.ic.t8{border-left-color:#64748b}
.ic.mine{background:linear-gradient(90deg,#12301a 0%,#0b1c2e 60%)}
.ih{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ih b{font-size:.92rem}.ih .pp{font-size:1.15rem;font-weight:800;color:#69BE28;white-space:nowrap}
.im{font-size:.7rem;color:#A5ACAF;margin-top:3px;line-height:1.45}
.im .own{font-weight:800;color:#e8eaed}.im .own.free{color:#D4A017}
.in{font-size:.74rem;margin-top:4px;color:#cbd5e1}
.sh{font-size:.8rem;font-weight:800;color:#69BE28;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.claim{border:2px solid #D4A017;border-radius:12px;padding:10px;background:#140f02;margin-bottom:10px}
.claim h2{color:#D4A017;font-size:1rem;margin-bottom:4px}
.bid{display:inline-block;background:#D4A017;color:#140f02;font-weight:800;border-radius:6px;padding:2px 7px;font-size:.8rem}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.jump a{background:#0b1c2e;border:1px solid #1e3a5f;color:#A5ACAF;padding:6px 10px;border-radius:14px;font-size:.72rem;font-weight:700;text-decoration:none}
.est{font-size:.68rem;color:#fcd34d;margin:6px 0}
.rk{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:.66rem;font-weight:800;border-radius:6px;padding:1px 6px;background:#1e3a5f;color:#e8eaed;white-space:nowrap}
.chip.wk{background:#173a1f;color:#8fe36a}.chip.ros{background:#2a2350;color:#c4b5fd}
.chip.up{background:#0f2f22;color:#4ade80}.chip.dn{background:#3a1d0b;color:#fbbf24}
.chip.tW{background:#38bdf8;color:#04121d}.chip.tR{background:#D4A017;color:#140f02}
.mn{font-size:.7rem;margin-top:3px;color:#93c5fd;line-height:1.4}
.sort{display:flex;gap:6px;margin:6px 0 2px}.sort button{flex:1;background:#0b1c2e;border:1px solid #1e3a5f;color:#A5ACAF;padding:7px;border-radius:8px;font-size:.74rem;font-weight:800}
.sort button.on{background:#69BE28;color:#04121d;border-color:#69BE28}
.unv{font-size:.66rem;color:#94a3b8;margin:4px 0 0 14px;padding:0}
</style>
</head>
<body>
<div class="sticky-top">
<header><div class="hdr"><img src="img/eddies.png" alt="Eddies"><div><h1>IDP Rankings</h1>
<div class="sub">Eagle Ridge Eddies · Wheels Up scoring · <a href="index.html" style="color:#69BE28">Back to War Room</a></div></div></div></header>
<div class="strip" id="strip">Loading…</div>
</div>
<main id="root"></main>
<p class="footer">Projections are estimates from a simple model. Read-only page; no claims or lineup changes are made from here.</p>
<script>
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var TEAM={eddies:'Eddies',dongers:'Dongers',doubtpfizer:'Doubtpfizer',goats:'Old Goats',hyper:'Hypersecretors',lab:'Little Ass Boys',morningside:'Morningside',newman:'Newman Lake',pocket:'Pocket Agents',saltese:'Saltese',slumlords:'Slumlords',substation:'Substation',ttab:'TTAB',ultron:'Ultron',FREE:'FREE'};
function f1(x){return (x==null||isNaN(x))?'–':Number(x).toFixed(1)}
function pct(x){return x==null?'–':Math.round(x*100)+'%'}
function own(l){return '<span class="own'+(l==='FREE'?' free':'')+'">'+e(TEAM[l]||l)+'</span>'}
function chg(c){if(c==null)return '<span class="chip">new</span>';if(c>0)return '<span class="chip up">▲'+c+'</span>';if(c<0)return '<span class="chip dn">▼'+(-c)+'</span>';return '<span class="chip">=</span>'}
function card(r,mode){
 var gd=r.greenDot==='green'?' · 🟢 green dot':(r.greenDot==='full'?' · full-time':'');
 var n=mode==='ros'?r.rosRank:r.weeklyRank;
 return '<div class="ic t'+r.tier+(r.league==='eddies'?' mine':'')+'"><div class="ih"><b>'+n+'. '+e(r.player)+'</b><span class="pp">'+(mode==='ros'?f1(r.rosPPG)+'<small style="font-size:.6rem;color:#A5ACAF"> ROS/wk</small>':(r.bye?'BYE':f1(r.proj)))+'</span></div>'+
 '<div class="rk"><span class="chip wk">W'+W+' #'+r.weeklyRank+'</span><span class="chip ros">ROS #'+r.rosRank+'</span>'+chg(r.rankChange)+'<span class="chip">Tier '+r.tier+'</span></div>'+
 '<div class="im">'+e(r.pos)+' '+e(r.team)+' '+(r.bye?'· BYE':'vs '+e(r.opp))+' · '+own(r.league)+'<br>Season '+f1(r.fpgSeason)+' FP/G · Last 3 '+f1(r.fpgL3)+' · Snaps '+pct(r.snapShareL3)+' (L3) · Tkl opp '+pct(r.tackleOpp)+(r.passRushProxy>0.03?' · Pressure '+pct(r.passRushProxy):'')+gd+'<br>ROS '+f1(r.rosPts)+' pts wks '+W+'–17'+(r.rosByeWeek?' · bye W'+r.rosByeWeek:'')+(r.rosSOS?' · sched x'+Number(r.rosSOS).toFixed(2):'')+'</div>'+
 (r.matchupNote?'<div class="mn">'+e(r.matchupNote)+'</div>':'')+
 (r.note?'<div class="in">'+e(r.note)+'</div>':'')+'</div>';
}
var W=0,D=null,MODE='wk';
function posHtml(){var h='';['DL','LB','DB'].forEach(function(p){var L=D.positions[p].slice().sort(function(a,b){return MODE==='ros'?a.rosRank-b.rosRank:a.weeklyRank-b.weeklyRank});
 h+='<div class="sh" id="'+p+'">'+p+' · '+(MODE==='ros'?'rest of season':'Week '+W)+' · '+L.length+' players</div>';L.forEach(function(r){h+=card(r,MODE)})});return h}
function setMode(m){MODE=m;document.getElementById('bW').className=m==='wk'?'on':'';document.getElementById('bR').className=m==='ros'?'on':'';document.getElementById('pos').innerHTML=posHtml()}
fetch('data/idp-rankings.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
 D=d;W=d.week;var f=d.faabContext;
 document.getElementById('strip').innerHTML='Week <span>'+d.week+'</span> · stats thru W'+d.statsThroughWeek+' · FAAB <span>$'+f.eddiesFaabLeft+'</span> · Byes: <span>'+e(d.byeTeams.join(', ')||'none')+'</span>';
 var h='<div class="est">'+e(d.label)+' Updated '+e(d.generatedAt)+'. Green dots: '+e(String(d.sources.greenDots||'').replace(/\s*\(https?:[^)]*\)/,''))+'.</div>';
 h+='<div class="jump"><a href="#claims">Claim targets</a><a href="#mine">My IDPs</a><a href="#movers">Top movers</a><a href="#DL">DL</a><a href="#LB">LB</a><a href="#DB">DB</a></div>';
 h+='<div class="claim" id="claims"><h2>Free-agent claim targets</h2><div class="im">For the '+e(f.nextClear)+' run. <b>ROS</b> = hold, worth FAAB · <b>WEEKLY</b> = one-week streamer, $0–1. League IDP winning bids: median $'+f.median+', 75th pct $'+f.p75+', top $'+f.max+' ('+f.n+' bids).</div>';
 d.claimTargets.forEach(function(t,i){h+='<div class="ic t1"><div class="ih"><b>'+(i+1)+'. '+e(t.player)+'</b><span class="bid">$'+t.bid+' ($'+t.range[0]+'–'+t.range[1]+')</span></div>'+
  '<div class="rk"><span class="chip '+(t.tag==='ROS'?'tR':'tW')+'">'+e(t.tag)+'</span><span class="chip wk">W'+W+' '+e(t.pos)+'#'+t.weeklyRank+'</span><span class="chip ros">ROS '+e(t.pos)+'#'+t.rosRank+'</span></div>'+
  '<div class="im">'+e(t.pos)+' '+e(t.team)+' vs '+e(t.opp)+' · proj '+f1(t.proj)+' · ROS '+f1(t.rosPPG)+'/wk · Season '+f1(t.fpgSeason)+' · L3 '+f1(t.fpgL3)+' · Snaps '+pct(t.snapShareL3)+(t.rosByeWeek?' · bye W'+t.rosByeWeek:'')+'</div>'+
  (t.matchupNote?'<div class="mn">'+e(t.matchupNote)+'</div>':'')+(t.note?'<div class="in">'+e(t.note)+'</div>':'')+'</div>'});
 h+='</div>';
 if(d.eddies&&d.eddies.length){h+='<div class="sh" id="mine">My IDPs (Eddies)</div>';d.eddies.forEach(function(m){h+='<div class="ic mine"><div class="ih"><b>'+e(m.player)+'</b><span class="pp">'+f1(m.proj)+'</span></div><div class="rk"><span class="chip wk">W'+W+' '+e(m.pos)+'#'+m.weeklyRank+'</span><span class="chip ros">ROS '+e(m.pos)+'#'+m.rosRank+'</span>'+(m.injury?'<span class="chip dn">'+e(m.injury)+'</span>':'')+'</div><div class="mn">'+e(m.matchupNote)+'</div></div>'})}
 h+='<div class="sh" id="movers">Top movers · rank vs last file (W'+(W-1)+')</div>';
 d.movers.up.forEach(function(m){h+='<div class="ic t2"><div class="ih"><b>▲ '+e(m.player)+'</b><span class="pp">+'+m.change+'</span></div><div class="im">'+e(m.pos)+' '+e(m.team)+' · '+own(m.league)+' · '+e(m.pos)+m.prevRank+' → '+e(m.pos)+m.weeklyRank+' · proj '+f1(m.prevProj)+' → '+f1(m.proj)+' · ROS #'+m.rosRank+'</div></div>'});
 d.movers.down.forEach(function(m){h+='<div class="ic t5"><div class="ih"><b>▼ '+e(m.player)+'</b><span class="pp" style="color:#f59e0b">'+m.change+'</span></div><div class="im">'+e(m.pos)+' '+e(m.team)+' · '+own(m.league)+' · '+e(m.pos)+m.prevRank+' → '+e(m.pos)+m.weeklyRank+' · proj '+f1(m.prevProj)+' → '+f1(m.proj)+' · ROS #'+m.rosRank+'</div></div>'});
 h+='<div class="sort"><button id="bW" class="on" onclick="setMode(\'wk\')">Week '+W+' ranks</button><button id="bR" onclick="setMode(\'ros\')">Rest of season</button></div>';
 h+='<div id="pos"></div>';
 if(d.unverified&&d.unverified.length){h+='<div class="sh">Unverified inputs</div><ul class="unv">';d.unverified.forEach(function(u){h+='<li>'+e(u)+'</li>'});h+='</ul>'}
 document.getElementById('root').innerHTML=h;document.getElementById('pos').innerHTML=posHtml();
}).catch(function(err){console.error(err);document.getElementById('strip').textContent='Could not load data/idp-rankings.json'});
</script>
</body>
</html>
