<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#002244">
<title>Robot vs. The Eddies</title>
<link rel="icon" href="img/eddies.png">
<link rel="stylesheet" href="css/warroom.css">
<style>
body.rv{overflow-x:hidden}
.rv .hdr > div:not(.tools){flex:1;min-width:0}
.rv .tools{flex:0 0 auto}
.rv h1{font-size:.98rem;line-height:1.15}
.rv .sub{line-height:1.35}
.rv .sub a{color:#69BE28;text-decoration:none;white-space:nowrap}
.rv .badge.wait{background:#78350f;color:#fcd34d}
.rv-main{max-width:640px;margin:0 auto;padding:10px 12px 28px}
.rv-tally h2,.rv-card h2,.rv-hist-title{font-size:.95rem;margin:0}
.rv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.rv-head h2{min-width:0;overflow-wrap:anywhere}
.rv-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.rv-score span{display:block;font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#A5ACAF}
.rv-score b{display:block;font-size:1.45rem;font-weight:800;color:#69BE28;letter-spacing:-.03em;line-height:1.05}
.rv-right{text-align:right}
.rv-right b{color:#7eb6ff}
.rv-mid{font-size:.72rem;font-weight:800;color:#64748b;padding-bottom:6px}
.rv-sub{font-size:.75rem;color:#cbd5e1;margin:8px 0}
.rv-empty{font-size:.84rem;line-height:1.4;margin:8px 0}
.rv-chips{display:flex;flex-wrap:wrap;gap:4px}
.rv-chips span{font-size:.62rem;font-weight:800;padding:3px 6px;border-radius:99px;background:#061018;color:#A5ACAF}
.rv-pill{font-size:.6rem;font-weight:800;padding:2px 6px;border-radius:99px;background:#1e293b;color:#cbd5e1;flex-shrink:0}
.rv-pill.win,.rv-pill.final{background:#14532d;color:#86efac}
.rv-pill.loss{background:#1e3a5f;color:#93c5fd}
.rv-pill.tie{background:#1e293b;color:#cbd5e1}
.rv-pill.pending{background:#78350f;color:#fcd34d}
.rv-card h3,.rv-dec{font-size:.72rem}
.rv-card h3{margin:12px 0 6px;color:#A5ACAF;text-transform:uppercase;letter-spacing:.04em;font-size:.68rem}
.rv-caption{font-weight:700;color:#64748b;text-transform:none;letter-spacing:0}
.rv-slot,.rv-dec{background:#061018;border-radius:8px;padding:8px 8px 4px;margin-bottom:6px;border-left:3px solid #1e3a5f}
.rv-slot.differ,.rv-dec{border-left-color:#fbbf24;background:#1a1408}
.rv-slot-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#A5ACAF}
.rv-flag{display:inline-block;background:#78350f;color:#fcd34d;border-radius:4px;padding:1px 4px;letter-spacing:.03em}
.rv-side{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"tag pts" "who pts";column-gap:8px;align-items:center;padding:4px 0}
.rv-side + .rv-side{border-top:1px solid #122334}
.rv-tag{grid-area:tag;font-size:.58rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#69BE28}
.rv-side.eddies .rv-tag{color:#7eb6ff}
.rv-who{grid-area:who;min-width:0}
.rv-player{display:block;font-weight:700;font-size:.86rem;line-height:1.2;overflow-wrap:anywhere}
.rv-player.muted{color:#64748b;font-weight:700}
.rv-meta{display:block;font-size:.62rem;color:#A5ACAF;line-height:1.3}
.rv-pad{padding:0 0 4px}
.rv-pts{grid-area:pts;font-size:.95rem;font-weight:800;color:#e8eaed;white-space:nowrap}
.rv-swing{font-size:.72rem;font-weight:800;letter-spacing:0;text-transform:none}
.rv-swing.up{color:#69BE28}
.rv-swing.down{color:#f87171}
.rv-swing.flat{color:#A5ACAF}
.rv-hist-title{margin:4px 0 8px}
.rv-history .card{border-left-color:#1e3a5f}
@media (max-width:389px){
  .rv-main{padding:8px 8px 24px}
  .rv h1{font-size:.9rem}
  .rv-score b{font-size:1.28rem}
  .rv-player{font-size:.8rem}
}
</style>
</head>
<body class="rv">
<div class="sticky-top">
<header>
  <div class="hdr">
    <img src="img/eddies.png" alt="Eddies">
    <div>
      <h1>Robot vs. The Eddies</h1>
      <div class="sub"><span id="clubSub">Eagleridge Eddie's</span> · times PT · <a href="index.html">War Room</a></div>
    </div>
    <div class="tools" id="headBadges"></div>
  </div>
</header>
<div class="strip" id="strip">Loading the scoreboard…</div>
</div>
<main class="rv-main" id="root"></main>
<p class="footer">Robot vs. The Eddies · read-only scoreboard · times PT</p>
<script src="js/robot-scoreboard.js"></script>
<script>
(function () {
  var escMap = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"};
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return escMap[c]; });
  }
  function $(id) { return document.getElementById(id); }
  var BASE = "data/robot-vs-bill/";

  function bust(url) {
    return url + (url.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
  }

  function loadJson(url) {
    return fetch(bust(url), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }

  function paint(model) {
    var week = model.current;
    var badge = !week.locked ? "NOT LOCKED" : week.status === "final" ? "FINAL" : "PENDING";
    var cls = !week.locked ? "wait" : week.status === "final" ? "ok" : "wait";
    $("headBadges").innerHTML = '<span class="badge ' + cls + '">' + esc(badge) + "</span>";
    $("clubSub").textContent = model.club;
    var bits = ["Week " + week.week];
    if (week.windowLabel) bits.push(week.windowLabel);
    bits.push(week.statusLabel);
    bits.push("times PT");
    $("strip").textContent = bits.join(" · ");
    $("root").innerHTML = WURobot.render(model);
  }

  function fail() {
    $("strip").textContent = "Scoreboard unavailable";
    $("root").innerHTML = '<section class="card"><h2>Scoreboard unavailable</h2><p>The scoreboard data could not be read.</p></section>';
  }

  function load() {
    return loadJson(BASE + "season.json").then(function (season) {
      var weeks = season.weeks || [];
      return Promise.all(weeks.map(function (w) {
        var file = w.file || ("w" + String(w.week).padStart(2, "0") + ".json");
        return loadJson(BASE + file).catch(function () { return null; });
      })).then(function (docs) {
        return WURobot.buildModel(season, docs.filter(Boolean));
      });
    }).then(paint).catch(fail);
  }

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
